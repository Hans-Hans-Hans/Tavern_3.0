# Legacy manual deployment overlay for docker/compose.yaml. Tavern 0.4 uses
# the calls profile in the canonical compose.yaml without this overlay.
services:
  coturn:
    image: coturn/coturn:4.17.2-r0
    restart: unless-stopped
    user: "0:0"
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${TAVERN_DATA_DIR:?}/calls/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports: ["3478:3478/tcp", "3478:3478/udp", "49160-49200:49160-49200/udp"]
    networks: [media]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    # Required by the pinned turnserver executable's file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ${TAVERN_DATA_DIR:?}/calls/livekit.yaml:/etc/livekit.yaml:ro
    ports: ["7881:7881/tcp", "7882:7882/udp"]
    networks: [private, media]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  rtc-auth:
    image: ghcr.io/element-hq/lk-jwt-service:0.6.0
    restart: unless-stopped
    env_file: ${TAVERN_DATA_DIR:?}/calls/jwt.env
    # Override legacy files without rewriting private credentials. The pinned
    # server and health probe agree on port 8080 when both overrides are empty.
    environment:
      LIVEKIT_JWT_BIND: ''
      LIVEKIT_JWT_PORT: ''
      LIVEKIT_URL: ${RTC_AUTH_LIVEKIT_URL:-http://livekit:7880}
    networks: [private, media]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  media: {}
