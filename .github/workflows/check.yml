name: Tavern checks
on:
  push:
    branches: [V3, 'codex/**']
  pull_request:
    branches: [V3]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tavern-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tracked files for private state and credentials
        run: python3 scripts/check-repository.py
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify installed app opens safely offline
        run: node scripts/smoke-pwa.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r integrations/requirements.txt -c integrations/requirements.lock
      - run: pip install -r api/requirements.txt
      - run: pip install -r ops/requirements.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/sync-compose-aliases.py --check
      - run: python3 -m compileall -q api ops docker/init synapse_modules
      - name: Validate GitHub deployment files
        env:
          TAVERN_DOMAIN: chat.example.test
          TAVERN_DATA_DIR: /tmp/tavern-validation-only
          SYNAPSE_IMAGE: matrixdotorg/synapse:v1.160.0
          LIVEKIT_KEY: validation-only
          LIVEKIT_SECRET: validation-only
        run: |
          docker compose -f compose.github.yaml config --quiet
          docker compose -f compose.github.full.yaml config --quiet
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.dockhand.yaml config --quiet
      - name: Build both images (remote Git contexts on branch pushes)
        env:
          TAVERN_EVENT: ${{ github.event_name }}
          TAVERN_REVISION: ${{ github.sha }}
        run: |
          if [ "$TAVERN_EVENT" = push ]; then
            docker build -t tavern-integrations:check "https://github.com/Hans-Hans-Hans/Tavern_3.0.git#$TAVERN_REVISION:integrations"
            docker build --target npm -t tavern:check "https://github.com/Hans-Hans-Hans/Tavern_3.0.git#$TAVERN_REVISION"
          else
            docker build -t tavern-integrations:check integrations
            docker build --target npm -t tavern:check .
          fi
      - name: Check gateway under production restrictions
        run: |
          docker run -d --name tavern-check --read-only --tmpfs /tmp:size=128m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true -e TAVERN_DOMAIN=chat.example.test -p 127.0.0.1:18080:8080 tavern:check
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 5 http://127.0.0.1:18080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_synapse/admin/v1/server_version)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/_matrix/federation/v1/version)" = 404
          curl --fail http://127.0.0.1:18080/tavern-config.json | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["homeserverUrl"]=="https://chat.example.test" and c["lockHomeserver"] is True'
      - if: always()
        run: |
          if docker container inspect tavern-check >/dev/null 2>&1; then
            docker logs tavern-check
            docker rm -f tavern-check
          fi
      - name: Start clean canonical stack and verify persistence
        env:
          TAVERN_DOMAIN: chat.example.test
          TAVERN_HTTP_PORT: '18081'
          NPM_PROXY_NETWORK: tavern_ci_proxy
          TAVERN_WEB_IMAGE: tavern:check
          TAVERN_API_IMAGE: tavern-api:check
          TAVERN_INIT_IMAGE: tavern-init:check
          TAVERN_DATA_DIR: ''
          COMPOSE_PROFILES: operations
          OPERATIONS_ENABLED: 'true'
          TAVERN_OPERATIONS_IMAGE: tavern-operations:check
          COMPOSE_FILE: compose.yaml:scripts/ci-live-compose.yaml
          TAVERN_CI_TLS: /tmp/tavern-ci-tls
          TAVERN_CI_SMOKE: 'true'
        run: |
          mkdir -p "$TAVERN_CI_TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$TAVERN_CI_TLS/key.pem" -out "$TAVERN_CI_TLS/cert.pem" -subj '/CN=chat.example.test' -addext 'subjectAltName=DNS:chat.example.test,DNS:ci-mail'
          cat /etc/ssl/certs/ca-certificates.crt "$TAVERN_CI_TLS/cert.pem" > "$TAVERN_CI_TLS/ca-bundle.pem"
          chmod 644 "$TAVERN_CI_TLS"/*.pem
          docker compose -p tavern-ci up -d --build --wait --wait-timeout 240
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 5 http://127.0.0.1:18085/health
          curl --fail http://127.0.0.1:18081/health
          curl --fail http://127.0.0.1:18081/api/system/version
          curl --fail http://127.0.0.1:18081/_matrix/client/versions
          docker compose -p tavern-ci exec -T -e TAVERN_CI_SMOKE=true operations python /app/smoke.py
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 5 http://127.0.0.1:18081/api/auth/config
          node scripts/smoke-live.mjs
          python3 scripts/ci-rollback.py
          docker compose -p tavern-ci exec -T synapse python -c 'from pathlib import Path; import hashlib; print(hashlib.sha256(Path("/data/server.signing.key").read_bytes()).hexdigest())' > /tmp/tavern-identity-before
          docker compose -p tavern-ci down
          docker compose -p tavern-ci up -d --wait --wait-timeout 240
          docker compose -p tavern-ci exec -T synapse python -c 'from pathlib import Path; import hashlib; print(hashlib.sha256(Path("/data/server.signing.key").read_bytes()).hexdigest())' > /tmp/tavern-identity-after
          cmp /tmp/tavern-identity-before /tmp/tavern-identity-after
          curl --fail http://127.0.0.1:18081/health
      - name: Collect stack logs
        if: always()
        env:
          TAVERN_DOMAIN: chat.example.test
          NPM_PROXY_NETWORK: tavern_ci_proxy
          COMPOSE_FILE: compose.yaml:scripts/ci-live-compose.yaml
          TAVERN_CI_TLS: /tmp/tavern-ci-tls
        run: docker compose -p tavern-ci logs --tail=100
