# Evaluate the final status as well as the normalized URI. Missing assets and
# errors must never become a year-long cached failure. No asset-name keywords
# (such as "admin") affect routing or permission checks.
map "$status:$uri" $tavern_cache_control {
    default "no-store";
    "~^(200|206|304):/assets/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|wasm|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico|mp3|mp4|ogg)$" "public, max-age=31536000, immutable";
    "~^(200|304):/(?:sw\.js|service-worker\.js)$" "no-cache";
}
