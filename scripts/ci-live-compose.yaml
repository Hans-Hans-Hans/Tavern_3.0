# Test-only overlay: the deployed application still uses the single compose.yaml.
services:
  init:
    entrypoint: [python, /ci/ci-call-config.py]
    volumes:
      - ./scripts/ci-call-config.py:/ci/ci-call-config.py:ro
    environment:
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:?The disposable GitHub Actions runner is required}
      TAVERN_CI_SMOKE: ${TAVERN_CI_SMOKE:?The isolated CI guard is required}
      TAVERN_CI_TLS: ${TAVERN_CI_TLS:?CI TLS fixture directory is required}
      COMPOSE_PROJECT_NAME: tavern-ci
      TAVERN_DATA_DIR: ''
      INTEGRATIONS_ENABLED: 'true'
      # Provision the native notice worker while the real profile service stays
      # excluded. The guarded helper owns its private alias in this CI project.
      COMPOSE_PROFILES: operations,calls,integrations
  livekit:
    image: tavern-sfu-audio:check
    command: [--config, /config/livekit.ci.yaml]
    ports: !reset []
    networks:
      private: {}
      media:
        ipv4_address: 172.30.239.2
  coturn:
    ports: !reset []
    # Exact owned bridge endpoint, with the production same-relay ACL/binding.
    command: ["exec /usr/bin/turnserver -c /config/turnserver.ci.conf --relay-ip=172.30.239.3 --allowed-peer-ip=172.30.239.3"]
    networks:
      media:
        ipv4_address: 172.30.239.3
  synapse:
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.ci.yaml
  rtc-auth:
    environment:
      # Trust this run's certificate; retain normal hostname/TLS verification.
      SSL_CERT_FILE: /ci/tls/ca-bundle.pem
    volumes:
      - ${TAVERN_CI_TLS:?CI TLS fixture directory is required}:/ci/tls:ro
  tavern-api:
    environment:
      INTEGRATIONS_ENABLED: 'true'
      SMTP_ENABLED: 'true'
      SMTP_HOST: ci-mail
      SMTP_PORT: '1465'
      SMTP_SECURE: 'true'
      SMTP_FROM_ADDRESS: tavern@example.test
      SSL_CERT_FILE: /ci/tls/ca-bundle.pem
    volumes:
      - ${TAVERN_CI_TLS:?CI TLS fixture directory is required}:/ci/tls:ro
    depends_on:
      ci-mail:
        condition: service_healthy
  ci-system-bot:
    image: tavern-integrations:check
    entrypoint: [python, /ci/ci-system-bot.py]
    environment:
      TAVERN_CI_SMOKE: 'true'
      TAVERN_PUBLIC_URL: https://chat.example.test
    volumes:
      - ./scripts/ci-system-bot.py:/ci/ci-system-bot.py:ro
      - ${TAVERN_CI_TLS:?CI TLS fixture directory is required}:/ci/tls:ro
      - integrations_config:/config
      - integrations_data:/data
    networks:
      private:
        aliases: [integrations]
      proxy: {}
    ports: [127.0.0.1:18086:8086]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      init:
        condition: service_completed_successfully
      synapse:
        condition: service_healthy
    # This reports the control helper only. The live probe starts the actual
    # sender later and separately requires its Matrix/crypto readiness.
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8086/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 20
  ci-mail:
    build:
      context: ./api
    image: tavern-api:check
    entrypoint: [python, /ci/ci-mail.py]
    environment:
      TAVERN_CI_SMOKE: 'true'
    volumes:
      - ./scripts/ci-mail.py:/ci/ci-mail.py:ro
      - ${TAVERN_CI_TLS:?CI TLS fixture directory is required}:/ci/tls:ro
    # Docker's internal network blocks the runner's published-port access.
    # The additional test proxy network makes the loopback-only inbox reachable.
    networks: [private, proxy]
    ports: [127.0.0.1:18085:8085]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 20
  ci-proxy:
    image: tavern:check
    entrypoint: [nginx, -c, /ci/nginx.conf, -g, 'daemon off;']
    # Allow the nonroot test proxy to serve standard private HTTPS discovery.
    # The host still publishes only the existing loopback 443 mapping.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '443'
    volumes:
      - ./scripts/ci-nginx.conf:/ci/nginx.conf:ro
      - ${TAVERN_CI_TLS:?CI TLS fixture directory is required}:/ci/tls:ro
    networks:
      proxy: {}
      private:
        aliases: [chat.example.test]
    ports: [127.0.0.1:443:8443]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, 'https://127.0.0.1:8443/health']
      interval: 2s
      timeout: 5s
      retries: 20
    depends_on:
      tavern-web:
        condition: service_healthy
networks:
  # No CI call service may discover or forward media outside this project.
  media:
    internal: true
    ipam:
      config:
        - subnet: 172.30.239.0/24
          # Dynamic peers must not claim the SFU endpoint during parallel startup.
          ip_range: 172.30.239.128/25
