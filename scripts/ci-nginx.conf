worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    proxy_temp_path /tmp/proxy;
    client_body_temp_path /tmp/body;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        # The issuer resolves this fixture directly on the private Docker network.
        # Matrix discovery uses HTTPS 443 before it can read .well-known.
        listen 443 ssl;
        server_name chat.example.test;
        ssl_certificate /ci/tls/cert.pem;
        ssl_certificate_key /ci/tls/key.pem;
        location / {
            # OpenID and SFU validation carry ephemeral tokens in the query.
            # Keep this test proxy from recording them on an upstream failure.
            error_log /dev/null crit;
            proxy_pass http://tavern-web:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
