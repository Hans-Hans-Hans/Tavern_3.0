# Complete image-only stack. Provision private configs before startup.
name: tavern
services:
  tavern-web:
    image: tavern:0.3.0
    pull_policy: never
    restart: unless-stopped
    environment:
      TAVERN_DOMAIN: ${TAVERN_DOMAIN:?Set the public Tavern hostname}
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - private
    - proxy
    depends_on:
      synapse:
        condition: service_healthy
    labels:
      dockhand.prune: 'false'
  synapse:
    image: ${SYNAPSE_IMAGE:?Select a pinned official Synapse image}
    restart: unless-stopped
    user: 991:991
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
    - ${TAVERN_DATA_DIR:?Run docker/prepare-npm.py first}/synapse:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ${TAVERN_DATA_DIR:?Run docker/prepare-npm.py first}/secrets/db_password:/run/secrets/db_password:ro
    networks:
    - private
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U synapse -d synapse
      interval: 10s
      timeout: 5s
      retries: 10
  coturn:
    image: coturn/coturn:4.17.2-r0
    restart: unless-stopped
    user: 0:0
    command:
    - -c
    - /etc/coturn/turnserver.conf
    volumes:
    - ${TAVERN_DATA_DIR:?}/calls/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
    - 3478:3478/tcp
    - 3478:3478/udp
    - 49160-49200:49160-49200/udp
    networks:
    - media
    read_only: true
    tmpfs:
    - /tmp:size=16m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command:
    - --config
    - /etc/livekit.yaml
    volumes:
    - ${TAVERN_DATA_DIR:?}/calls/livekit.yaml:/etc/livekit.yaml:ro
    ports:
    - 7881:7881/tcp
    - 7882:7882/udp
    networks:
    - private
    - media
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  rtc-auth:
    image: ghcr.io/element-hq/lk-jwt-service:0.6.0
    restart: unless-stopped
    networks:
    - private
    - media
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      LIVEKIT_URL: wss://${TAVERN_DOMAIN}/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_KEY:?Copy the generated value into Dockhand stack environment}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET:?Copy the generated value into Dockhand stack
        environment}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${TAVERN_DOMAIN}
      LIVEKIT_JWT_BIND: :8080
  integrations:
    image: tavern-integrations:0.3.0
    pull_policy: never
    restart: unless-stopped
    volumes:
    - ${TAVERN_DATA_DIR:?}/integrations/config:/config:ro
    - ${TAVERN_DATA_DIR:?}/integrations/data:/data
    networks:
    - private
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  private:
    internal: true
  proxy:
    external: true
    name: ${NPM_PROXY_NETWORK:-npm_proxy}
  media: {}
volumes:
  postgres_data: null
